[package]
name = "ex_scylla"
version = "0.11.0"
authors = []
edition = "2021"

[lib]
name = "ex_scylla"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.39.0" }
scylla = { version = "=1.10.0", features = ["full-serialization", "metrics", "chrono-04", "bigdecimal-04", "num-bigint-04", "unstable-nodejs-rs"] }
bytes = "1.12"
tokio = { version = "^1.54", features = ["full"] }
futures = "^0.3.34"
uuid = "^1.29"
bigdecimal = "^0.4.11"
chrono = "^0.4.45"
num-bigint = "^0.5.1"
tracing = "^0.1.44"
